name: ContentGuard CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Run API Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. 获取 GitHub 仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 3. 安装项目依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 执行自动化测试
      - name: Run pytest
        run: python -m pytest -v